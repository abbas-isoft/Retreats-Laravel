    responses:
      -
        custom: []
        status: 200
        content: '{"status":true,"message":"Filtered properties fetched successfully.","data":{"properties":[{"id":1,"property_id":575651,"customer_property_id":"AH","active":1,"property_name":"Abbey House by Group Retreats","subcaption":"Sleeps 26 - Grand Country House with Private Pool","description":"<span style=\"font-size:12px\"><span style=\"font-family:arial,helvetica,sans-serif\">Nine-bedroom Abbey House sits in the grounds of the magnificent Audley End Estate. The perfect space for entertaining, hosting, dining, and simply putting your feet up and enjoying the company of friends and family. This property is wonderfully set in the open countryside of Saffron Walden, a short train ride from London and Cambridge, and offers an ideal combination of authentic charm with modern features for comfort.<\/span><\/span>","accommodations_summary":"<span style=\"font-size:12px\"><span style=\"font-family:arial,helvetica,sans-serif\">Abbey House looks out towards Audley End House, a 17th Century Jacobean mansion, widely regarded as one of the finest country houses in England. This stunning location is available to hire exclusively for family get togethers, celebrations, corporate entertaining, or team building exercises. There are plenty of spaces here to play, party or just be together, and smaller spaces to break out, read and unwind.<br \/>\r\n<br \/>\r\nThe property is approached from a private drive and has parking for between 8-10 cars. The house is entered through the impressive entrance hall.<br \/>\r\n<br \/>\r\nThe house has a grand dining room, that has views across the gardens and an open fireplace. There is a fully equipped kitchen for all your catering needs. Whether you choose to cook a family meal or bring in a professional chef, you can dine like Lords and Ladies of the Manor.<br \/>\r\n<br \/>\r\nAbbey House has nine beautifully furnished bedrooms to choose from, four ensuites, and there are two further bathrooms and a downstairs loo. All linen is provided.<br \/>\r\n<br \/>\r\nThere is another sitting room ideal for relaxing or entertaining. The library has comfortable seating, a log burner and books for anyone in the family that would like to enjoy some peace and quiet. We have a games room with a poker table and a separate TV room ideal for the family. We have a den in the loft complete with sofa bed and playstation.<br \/>\r\n<br \/>\r\nWith a swimming pool and great landscaped gardens and grounds to explore, there&rsquo;s plenty to keep children occupied. The pool is heated from April to October and the pool house has a bar area and barbecue ideal for summer bookings. There is a covered winter garden where you can play table tennis.<br \/>\r\n<br \/>\r\nWalkers and cyclists can enjoy a wide variety of footpaths and trails. This house is a superb base for discovering the stunning countryside that is all around or for experiencing the medieval market town of Saffron Walden. You&rsquo;ll find many fantastic pubs and restaurants here.<br \/>\r\n<br \/>\r\nTake the kids to Audley End Miniature Railway where they can ride mini steam engines. Alternatively, take a look around the breath-taking Audley End House or spend a day at Saffron Walden Golf Club. Cambridge is only a short drive away where you can go punting on the river or enjoy a night out.<br \/>\r\n<br \/>\r\nWhatever you choose to do with your time, you will have a fantastic stay at Abbey House.<\/span><\/span>","location_description":"\r\nAudley End, England, United Kingdom\r\n\r\nLocated i...","changeover":"","second":"","address_line":"Abbey House, Audley End Road","city":"Saffron Walden","country":"GB","post_code":"CB114JB","latitude":"52.0187750","longitude":"0.2205920","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":9,"bathroom_count":6,"area":10000,"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","POOL_SPA_HOT_TUB","OUTDOOR_FENCED_YARD","KITCHEN_DINING_COFFEEM