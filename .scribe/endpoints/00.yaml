rge garden and the impressive countryside views. Relax in the hot tub, or find the perfect spot to watch the bird life or go fishing in the river Irfon. If that&#39;s not enough, then why not create lasting memories with your friends and family beside our above ground pool? Accompanied with sun loungers and additional seating, the pool area provides the perfect spot for gatherings in the warmer months of April - October.. Caer Beris Manor is the perfect property for ensuring you have the best views everywhere you look. With various habitats such as the river and a cliff, you are bound to spot all sorts of wildlife in the gardens.<\/p>\r\n<br \/>\r\nAt the bottom of the drive you will find the Wye Valley Walk, meaning you can leave your car behind and walk\/cycle the trail.<br \/>\r\n<br \/>\r\nThe property is accessible for wheelchair users, and has ground floor bedrooms.","location_description":"\r\nCaer Beris Manor is right next door to the marke...","changeover":"","second":"","address_line":"Garth Road","city":"Builth Wells, Wales","country":"GB","post_code":"LD2 3NP","latitude":"52.1469061","longitude":"-3.4190510","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":21,"bathroom_count":22,"area":15000,"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","KITCHEN_DINING_HIGHCHAIR","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_MICROWAVE","KITCHEN_DINING_OVEN","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","EV_CAR_CHARGER","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","AMENITIES_HAIR_DRYER","GENERAL_TRAVEL_CRIB","AMENITIES_LINENS","ENTERTAINMENT_SMART_TV"],"created_at":"2025-07-17T16:25:34.000000Z","updated_at":"2025-09-23T15:18:35.000000Z","images":[{"id":11030,"property_c