all has 10 comfortable bedrooms sleeping up to 33 people. Bedrooms 1-7 all have ensuites with a further bathroom shared by rooms 8-10. Downstairs you will find a his and hers cloakroom.<br \/>\r\n<br \/>\r\nSurrounded by delightful countryside views, you will also have access to private formal gardens and paddock land, great to explore or enjoy a picnic. The outside swim\/spa is perfect to unwind and take in the tranquil surroundings.<br \/>\r\n<br \/>\r\nAround a 20 minute drive away you will find Lincoln, a vibrant university city which offers a variety of facilities including an excellent choice of shops, restaurants, public houses and leisure activities.","location_description":"In the Village of Glentworth, less than a 30 minute drive to Scunthorpe and around 40 minutes from Grimsby. You will will also find Lincoln, a vibrant University City 20 minutes drive away offering a variety of facilities including an excellent choice of shops, restaurants, public houses and leisure activities and provides direct daily trains to London Kings Cross. The property is also well located for the A15 which leads to the M180 motorway network and Humberside Airport with excellent international flight connections.","changeover":"","second":"","address_line":"Glentworth Hall, Northlands Road ","city":"Glentworth ","country":"GB","post_code":"DN21 5DA","latitude":"53.3819800","longitude":"-0.5737900","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":10,"bathroom_count":8,"area":15000,"reviews":[],"content_listings":[{"property_id":628055,"property_url":"https:\/\/groupretreats.co.uk\/pf\/glentworth-hall\/","customer_property_id":"GH ","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":true,"maximum_adults":33,"maximum_guests":33,"maxim