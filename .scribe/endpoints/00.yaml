or your party.","accommodations_summary":"<p data-end=\"484\" data-start=\"0\"><strong data-end=\"15\" data-start=\"0\">Walcot Hal<\/strong><strong data-end=\"15\" data-start=\"0\">l<\/strong> is a stunning Grade II listed Georgian manor, nestled in the heart of Lincolnshire, offering a unique and luxurious retreat amidst breathtaking countryside scenery. This elegant and historic property accommodates up to 25 guests, making it the perfect venue for family gatherings, celebrations, or corporate events. The hall features 8 spacious bedrooms, comfortably sleeping 16 guests, with 5 additional pull-out beds to provide flexible accommodation for your party.<\/p>\r\n\r\n<p data-end=\"969\" data-start=\"486\">Inside, the property is thoughtfully decorated, blending its historic charm with contemporary style to create a welcoming and comfortable atmosphere throughout. There are multiple lounge areas where guests can relax, unwind, and enjoy each other&rsquo;s company, offering plenty of space for everyone to find their perfect spot. The large dining room provides an ideal setting for shared meals and special occasions, with ample space to gather around the table and create lasting memories.<\/p>\r\n\r\n<p data-end=\"1320\" data-start=\"971\">For an extra touch of charm and adventure, an enchanting yurt is available from April to October, providing a unique glamping experience with space for 4 additional guests. Set within the grounds of the hall, the yurt offers a cozy and memorable stay, combining rustic appeal with comfort, all while being immersed in the surrounding natural beauty.<\/p>\r\n\r\n<p data-end=\"1735\" data-start=\"1322\">Set within beautifully landscaped gardens, Walcot Hall enjoys panoramic views of rolling hills and tranquil woodland, providing the perfect backdrop for relaxation or outdoor activities. Whether you&#39;re enjoying a peaceful moment in the outdoor seating area, playing a friendly match on the private tennis court, or unwinding in the hot tub, the estate offers an array of amenities to make your stay unforgettable. Also in the garden you&#39;ll find a hot tub to relax in, accompanied with some garden furniture.<\/p>\r\n\r\n<p data-end=\"2082\" data-start=\"1737\">The fully-equipped kitchen is ideal for those who love to cook, with modern appliances and plenty of space for preparing meals for large groups. For those who prefer to relax and enjoy gourmet meals without the hassle, guests have the option to hire a caterer, allowing you to indulge in delicious, expertly prepared dishes throughout your stay.<\/p>\r\n\r\n<p data-end=\"2295\" data-start=\"2084\">Whether you&#39;re here to enjoy the stunning scenery of Lincolnshire, indulge in outdoor recreation, or simply relax in luxurious surroundings, Walcot Hall offers the perfect escape in the heart of the countryside.<\/p>\r\n","location_description":"Whether you&#39;re here to enjoy the stunning scenery of Lincolnshire, indulge in outdoor recreation, or simply relax in luxurious surroundings, Walcot Hall offers the perfect escape in the heart of the countryside.","changeover":"","second":"","address_line":"Walcot Road","city":"North Lincolnshire ","country":"GB","post_code":"DN15 9JT","latitude":"53.6771927","longitude":"-0.6722744","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":8,"bathroom_count":5,"area":1,"reviews":[],"content_listings":[{"property_id":653617,"property_url":"https:\/\/groupretreats.co.uk\/property.php?id=653617","customer_property_id":"WH","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":false,"maximum_adults":25,"maximum_guests":25,"maximum_children":0,"maximum_infants":0,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enqu