. It is packed with original features, open fires, pool table, hot tub, above ground pool, tennis court, games room and a dining table that comfortably seats 20 people. It is nestled in the sleepy countryside of Norfolk and is perfect for family breaks, couples, milestone celebrations, business groups and hen parties.","accommodations_summary":"The house is arrive at via an impressive private drive which brings you the imposing forecourt of the house. Before you and your guests step through the door, you will know that you&#39;re in for a great time at Saham Grove Hall. It is packed with original features, open fires, pool table, a games room and a dining table that sits 20 people.<br \/>\r\n<br \/>\r\nSurrounded by four acres of beautifully kept gardens and grounds, there is more than enough space to entertain the whole group with garden games and even a spot of tennis. We also have a hot tub to help soak away the stresses of everyday life which is available all year round. If that&#39;s not enough, then why not create lasting memories with your friends and family beside our above ground pool? Accompanied with sun loungers and additional seating, the pool area provides the perfect spot for gatherings in the warmer months of April - October.. There is a games room complete will pool table, and two lounges where you can entertain friends, or perhaps get away from it all with a book.<br \/>\r\n<br \/>\r\nThe house backs onto a farmyard, which is a working arable farm. You may experience the sounds of a busy farm at peak times such as Spring and harvest, but this only adds to the countryside experience.","location_description":"Saham Grove Hall is perfectly nestled within the N...","changeover":"","second":"","address_line":"Saham Grove Hall, Shipdham","city":"Dereham","country":"GB","post_code":"IP25 7RE","latitude":"52.6227513","longitude":"0.8486249","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":11,"bathroom_count":5,"area":10000,