 enjoy the gardens. Leading on from the conservatory, you will find a fantastic heated indoor pool and hot tub. There is also a cosy snug, furnished with a TV and comfy seating for when you want to put your feet up and enjoy some downtime.<br \/>\r\n<br \/>\r\nMilton House has a total of 10 fantastic bedrooms, six bathrooms and a downstairs loo. All bedding, linen and towels are provided. Our games room has a snooker table, table tennis, darts board and movie area. Outside, we have wonderful gardens to explore, complete with a barbecue area, tennis court and interconnected lakes which attract all kinds of wildlife. Being close to the the Twinwoods Adventure Park which offers indoor skydiving and surfing, as well as Bedford town centre, there is plenty to do in the local area! Bedford has a wonderful river to walk along as well as many great pubs, restaurants and shops. Bedford train station is on a direct line to London Bridge and Kings Cross St Pancras. With great links to the M1 and A1 and plenty of parking; getting to Milton House is a breeze.<br \/>\r\n ","location_description":"Milton Ernest is a lovely village about miles away...","changeover":"","second":"","address_line":"Bedford Road","city":"Bedford","country":"GB","post_code":"MK44 1RL","latitude":"52.1876435","longitude":"-0.5036356","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":10,"bathroom_count":6,"area":10000,"area_unit":"MetersSquared","amenities":["AMENITIES_PARKING","OUTDOOR_FENCED_YARD","KITCHEN_DINING_COFFEEMAKER","SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_WASHER","POOL_SPA_HOT_TUB","SMOKE_DETECTOR","AMENITIES_HAIR_DRYER","OUTDOOR_GRILL","AMENITIES_LINENS","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","GENERAL_TRAVEL_CRIB","ENTERTAINMENT_SMART_TV"],"created_at":"2025-07-17T16:25:05.000000Z","updated_at":"2025-09-23T15:18:13.000000Z","images":[{"id":10614,"property_content_id":3,"photo_id":"190096644","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/i