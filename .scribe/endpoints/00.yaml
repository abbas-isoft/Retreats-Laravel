throoms. Plenty of room for large groups. All bedding, linen and towels are provided.<br \/>\r\n<br \/>\r\nThe garden can be accessed through open doors onto a sun trapped patio, which has plenty of seating and a bbq suitable for large outdoor self-catering along with a hot tub and sauna. The property also benefits from a substantial glass palm room to the front.<br \/>\r\n<br \/>\r\nPlease note that The Castle is closed from August 2025 until June 2026 due to some ongoing repairs.","location_description":"Nestled away in the Durham countryside and sitting within 14 acres of land surrounded by a nature reserve, this is the ideal place to escape from the modern world and indulge with friends and family, for holidays, long weekends or reunion get-togethers.","changeover":"","second":"","address_line":"23 Lower Brook Street, Amended","city":"Ipswich ","country":"GB","post_code":"IP4 1AQ ","latitude":"52.0538630","longitude":"1.1549192","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":6,"bathroom_count":6,"area":0,"reviews":[],"content_listings":[{"property_id":659508,"property_url":null,"customer_property_id":"","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":false,"maximum_adults":30,"maximum_guests":30,"maximum_children":0,"maximum_infants":0,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enquiries":true}],"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","COMMON_SURFACE_DISINFECTANT_CLEANED","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_MICROWAVE","KITCHEN_