18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"},{"id":10577,"property_content_id":1,"photo_id":"192582972","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192582972.jpg","created_at":"2025-09-23T15:18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"},{"id":10578,"property_content_id":1,"photo_id":"192582973","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192582973.jpg","created_at":"2025-09-23T15:18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"},{"id":10579,"property_content_id":1,"photo_id":"192582974","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192582974.jpg","created_at":"2025-09-23T15:18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"},{"id":10580,"property_content_id":1,"photo_id":"192582975","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192582975.jpg","created_at":"2025-09-23T15:18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"},{"id":10581,"property_content_id":1,"photo_id":"192582976","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192582976.jpg","created_at":"2025-09-23T15:18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"},{"id":10582,"property_content_id":1,"photo_id":"190286004","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/190286004.jpg","created_at":"2025-09-23T15:18:10.000000Z","updated_at":"2025-09-23T15:18:10.000000Z"}]},{"id":2,"property_id":575790,"customer_property_id":"TF","active":1,"property_name":"Timberley House by Group Retreats","subcaption":"Sleeps 24 - Stunning Country House with Pool & Spa","description":"Timberley House is a beautiful Georgian farmhouse sat with uninterrupted views across the South Downs and Amberley Castle. This stunning location is available to hire exclusively for family get togethers, celebrations, corporate entertaining, or team building exercises. There are plenty of spaces here to play, party or just be together, and smaller spaces to break out, read and unwind.","accommodations_summary":"Timberley House is a beautiful Georgian farmhouse sat with uninterrupted views across the South Downs and Amberley Castle. This stunning location is available to hire exclusively for family get togethers, celebrations, corporate entertaining, or team building exercises. There are plenty of spaces here to play, party or just be together, and smaller spaces to break out, read and unwind.<br \/>\r\n<br \/>\r\nThe house is approached along a private road with plenty of parking available. From the moment you arrive you will feel right at home. There is a large dining room with seating for 24 people. We have some extra tables so there is room for everyone to dine in style. Our kitchen is fully stocked with everything you need to cook a fantastic meal, whether you decide to do it yourself or bring a professional chef. Timberley House has 12 fantastic bedrooms, six bathrooms and three separate toilets. All bedding, linen and towels are provided for you. Nine of these bedrooms are in the main house and three are in the annex right next door. Our sitting room is perfect for getting the everyone together and watching a film.<br \/>\r\n<br \/>\r\nThere is also a lounge with a log burner which is a great spot to enjoy a drink in the company of good friends. Our large games room has a full-size snooker table, table football and a darts board, as well as ample seating for your group. Outside you will also find another outbuilding where you can relax with your group and enjoy the a film together in the movie room. Enjoy some of the best views of the South Downs from our balcony which is a great spot for enjoying a cup of tea and watching the sun rise over Amberley Castle. Outside, you will find a swimming pool, cold shower, tennis court and wonderful gardens to explore. The pool is heated from April to October and the hot tub is open all year round. There are fantastic walks to be had right on your doorstep. Walking through the estate and down the river, you will eventually end up in the picturesque village of Bury. There are many fantastic pubs nearby to enjoy some good food and a drink.<br \/>\r\n<br \/>\r\nGuests have exclusive access to the house, annex and gardens. The hot tub and tennis court are available all year round and the pool is open from 1st April - 1st October. Guests have access to a walking route along the river that runs through the estate. This may be subject to change at certain times of the year.","location_description":"Bury is a truly beautiful village in the heart of...","changeover":"","second":"","address_line":"Bury Common","city":"Pulborough","country":"GB","post_code":"RH20 1NP","latitude":"50.9178604","longitude":"-0.5627463","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":12,"bathroom_count":6,"area":10000,"area_unit":"MetersSquared","amenities":["SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_IRON_BOARD","COMMON_SURFACE_DISINFECTANT_CLEANED","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_OVEN","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","SMOKE_DETECTOR","ENTERTAINMENT_SMART_TV","AMENITIES_FIREPLACE","AMENITIES_HAIR_DRYER","GENERAL_TRAVEL_CRIB","AMENITIES_LINENS"],"created_at":"2025-07-17T16:25:03.000000Z","updated_at":"2025-09-23T15:18:11.000000Z","images":[{"id":10583,"property_content_id":2,"photo_id":"190096610","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/190096610.jpg","created_at":"2025-09-23T15:18:11.000000Z","updated_at":"2025-09-23T15:18:11.000000Z"},{"id":10584,"property_content_id":2,"photo_id":"192674176","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192674176.jpg","created_at":"2025-09-23T15:18:11.000000Z","updated_at":"2025-09-23T15:18:11.000000Z"},{"id":10585,"property_content_id":2,"photo_id":"19267417