erything you could need to prepare meals for you and your group. Alternatively, you could choose to hire in an external caterer to do the work for you whilst you sit back and relax. The dining table can seat eight guests, additionally to this we can provide a high chair so that your little one won&#39;t miss out.","location_description":"Being close to Salisbury, you won&#39;t be short of things to do locally ranging from taking any little ones to Paultons Family Theme Park, Longleat Safari and Adventure Park, or visiting Thruxton Motorsport Centre. Stonehenge and New Forest National Park and just two more of the must see attractions whilst staying at the property. Stables Cottage really does provide something for all occasions, whether that be a family getaway, a trip with friends, or a corporate event.","changeover":"","second":"","address_line":"Stables Cottage, Shute End Road, Alderbury","city":"Salisbury","country":"GB","post_code":"SP5 3DJ","latitude":"51.0462915","longitude":"-1.7456981","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":3,"bathroom_count":2,"area":1,"reviews":[],"content_listings":[{"property_id":641995,"property_url":"https:\/\/groupretreats.co.uk\/property.php?id=641995","customer_property_id":"STC","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":true,"maximum_adults":8,"maximum_guests":8,"maximum_children":6,"maximum_infants":6,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enquiries":true}],"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","COMMON_SURFACE_DISINFECTANT_CLEANED","KITCHEN_DINING_COFFEEMAKER","A