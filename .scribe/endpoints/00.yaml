. The perfect property to relax with family and friends, celebrate a special occasion, or host an important work retreat.","accommodations_summary":"Caer Beris Manor has 21 beautifully decorate bedrooms, each with their own en suite bathroom. Sleeping up to 42 guests, there is room for all the family! You can also make use of The Suite, perfect for a couples getaway.<br \/>\r\n<br \/>\r\nInside you will find a well appointed kitchen with everything you need to prepare meals for everyone in the group, whether you choose to do it yourself or bring in a profession chef!\r\n<p>Take some time out to relax in the drawing room, or join friends and family with a game of cards or a little competition with one of the many board games. In front of the open fires is a great place to sit back and read a book or enjoy a drink for those who wish to enjoy some peace and quiet.<\/p>\r\n\r\n<p>Outside, you can enjoy the serenity of the large garden and the impressive countryside views. Relax in the hot tub, or find the perfect spot to watch the bird life or go fishing in the river Irfon. If that&#39;s not enough, then why not create lasting memories with your friends and family beside our above ground pool? Accompanied with sun loungers and additional seating, the pool area provides the perfect spot for gatherings in the warmer months of April - October.. Caer Beris Manor is the perfect property for ensuring you have the best views everywhere you look. With various habitats such as the river and a cliff, you are bound to spot all sorts of wildlife in the gardens.<\/p>\r\n<br \/>\r\nAt the bottom of the drive you will find the Wye Valley Walk, meaning you can leave your car behind and walk\/cycle the trail.<br \/>\r\n<br \/>\r\nThe property is accessible for wheelchair users, and has ground floor bedrooms.","location_description":"\r\nCaer Beris Manor is right next door to the market town of Builth Wells, which provides you with shops, restaurants, and pubs - all a 10 minute walk away.\r\n\r\nIf you wish to visit the Elan Valley&#39;s formidable Victorian dams and reservoirs, you will find these just a 30 minute drive away. Here you will also find the Brecon Beacons National Park.","changeover":"","second":"","address_line":"Garth Road","city":"Builth Wells, Wales","country":"GB","post_code":"LD2 3NP","latitude":"52.1469061","longitude":"-3.4190510","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":21,"bathroom_count":22,"area":15000,"reviews":[],"content_listings":[{"property_id":629799,"property_url":"https:\/\/groupretreats.co.uk\/pf\/caer-beris-manor\/","customer_property_id":"CB","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":true,"maximum_adults":42,"maximum_guests":42,"maximum_children":20,"maximum_infants":20,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enquiries":true}],"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","KITCHEN_DINING_HIGHCHAIR","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_MICROWAVE","KITCHEN_DINING_OVEN","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","EV_CAR_CHARGER","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","AMENITIES_HAIR_DRYER","GENERAL_TRAVEL_CRIB","AMENITIES_LINENS","ENTERTAINMENT_SMART_TV"],"images":[{"property_content_id":15,"photo_id":"191742757","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191742757.jpg"},{"property_content_id":15,"photo_id":"191742758","url":"https:\/\/c621446.ssl.cf3.rackcdn.com