ind a pool table to enjoy, board games and we also provide a Bluetooth speaker so that you and your group can enjoy a sing-a-long.<br \/>\r\n<br \/>\r\nThe house has a total of nine beautifully decorated bedrooms and can accommodate up to 28 guests, meaning that there is enough space for the entire group. Two of the bedrooms are en-suite, and there are also two separate bathrooms.<br \/>\r\n<br \/>\r\nIn the beautiful gardens surrounding Ashfield Place Farm, you will find and a tennis court, swimming pool and hot tub for those who wish to exercise, or unwind and relax. The hot tub is heated all year round. Swimming pool available from 01 Apr to 1 Oct.<br \/>\r\n<br \/>\r\nIf you have the time to explore the large gardens, you will find many picturesque spots to enjoy a picnic! The large gardens are very well cared for, and there is plenty of space for exploring, games, and finding the perfect spot for a picnic! ","location_description":"Nine-bedroom Ashfield Place sits within 6 acres of...","changeover":"","second":"","address_line":"Ashfield Place Farm","city":"Stowmarket","country":"GB","post_code":"IP14 6LU","latitude":"52.2088831","longitude":"1.2259665","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":9,"bathroom_count":4,"area":10000,"area_unit":"MetersSquared","amenities":["AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_OVEN","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","OUTDOOR_BALCONY","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","AMENITIES_FIREPLACE","AMENITIES_HAIR_DRYER","AMENITIES_LINENS","GENERAL_TRAVEL_CRIB","ENTERTAINMENT_SMART_TV"],"created_at":"2025-07-17T16:25:29.000000Z","updated_at":"2025-09-23T15:18:31.000000Z","images":[{"id":10943,"property_content_id":13,"photo_id":"192118191","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192118191.jpg","c