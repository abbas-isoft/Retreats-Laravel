the Salisbury Playhouse&mdash;a renowned regional theatre that adds to the city&rsquo;s vibrant arts scene.\r\n\r\nOriginally built as the Dower House to the Longford Estate and overlooking the majestic Longford Castle, Alward House remains within the family of the Earl of Radnor, preserving its heritage and grandeur.\r\n\r\nInside, the property offers generous space for relaxation and entertaining. Five elegant reception rooms, including stylish drawing rooms and a spacious dining room, provide the perfect setting to unwind and gather with friends or family. The fully equipped kitchen has everything needed to cater for a group, or you may choose to bring in a private chef for a more luxurious experience. The dining room features a large table that comfortably seats all guests, and high chairs are available for little ones.\r\n\r\nWith 12 bedrooms, Alward House can accommodate large groups with ease. The sleeping arrangements include a flexible mix of Super King Link beds, Doubles, Singles, and portable folding Z-beds&mdash;ideal for children. Fresh linens and bedding are provided to ensure a restful night&rsquo;s sleep for all.\r\n\r\nThe property also includes six well-appointed bathrooms, two additional WCs, and all the modern amenities you&rsquo;d expect, all while maintaining its classic charm.\r\n\r\nAlward House is the perfect setting for memorable reunions, celebrations, or simply a peaceful retreat in one of England&rsquo;s most beautiful countryside locations.\r\n","latitude":"51.0459912","longitude":"-1.7471405","post_code":"SP5 3DJ","city":"Salisbury ","country":"GB","images":["https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/191864204.jpg","https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192155738.jpg","https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192155777.jpg","https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192155772.jpg","https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192155775.jpg"