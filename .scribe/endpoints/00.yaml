perty_id":636608,"customer_property_id":"AWH","active":1,"property_name":"Alward House by Group Retreats","subcaption":"","description":"Alward House is a grand Victorian house which sleeps up to 35 people - there&#39;s room for everyone! A picturesque Grade II historic house with swimming pool and spa, it is set within acres of parkland surrounded by beautiful views . A fantastic location for beaches and local attractions, Alward House is the perfect property to relax with family and friends or celebrate a special occasion.","accommodations_summary":"Nestled in a serene corner of the historic Longford Estate, Alward House offers stunning views across the unspoiled rural landscape. Just a short distance from the charming Cathedral City of Salisbury, Alward House enjoys a peaceful setting while remaining ideally located for holidays and group getaways alike.\r\n<p data-end=\"796\" data-start=\"528\">Salisbury is rich in history and character, with its iconic cathedral, beautiful architecture, and a wide selection of shops and restaurants. Culture lovers will appreciate the Salisbury Playhouse&mdash;a renowned regional theatre that adds to the city&rsquo;s vibrant arts scene.<\/p>\r\n\r\n<p data-end=\"1002\" data-start=\"798\">Originally built as the Dower House to the Longford Estate and overlooking the majestic Longford Castle, Alward House remains within the family of the Earl of Radnor, preserving its heritage and grandeur.<\/p>\r\n\r\n<p data-end=\"1512\" data-start=\"1004\">Inside, the property offers generous space for relaxation and entertaining. Five elegant reception rooms, including stylish drawing rooms and a spacious dining room, provide the perfect setting to unwind and gather with friends or family. The fully equipped kitchen has everything needed to cater for a group, or you may choose to bring in a private chef for a more luxurious experience. The dining room features a large table that comfortably seats all guests, and high chairs are available for little ones.<\/p>\r\n\r\n<p data-end=\"1805\" data-start=\"1514\">With 12 bedrooms, Alward House can accommodate large groups with ease. The sleeping arrangements include a flexible mix of Super King Link beds, Doubles, Singles, and portable folding Z-beds&mdash;ideal for children. Fresh linens and bedding are provided to ensure a restful night&rsquo;s sleep for all.<\/p>\r\n\r\n<p data-end=\"1967\" data-start=\"1807\">The property also includes six well-appointed bathrooms, two additional WCs, and all the modern amenities you&rsquo;d expect, all while maintaining its classic charm.<\/p>\r\n\r\n<p data-end=\"2129\" data-start=\"1969\">Alward House is the perfect setting for memorable reunions, celebrations, or simply a peaceful retreat in one of England&rsquo;s most beautiful countryside location<\/p>\r\n","location_description":"Nestled in a serene corner of the historic Longford Estate, Alward House offers stunning views across the unspoiled rural landscape. Just a short distance from the charming Cathedral City of Salisbury, Alward House enjoys a peaceful setting while remaining ideally located for holidays and group getaways alike.\r\n\r\nSalisbury is rich in history and character, with its iconic cathedral, beautiful architecture, and a wide selection of shops and restaurants. Culture lovers will appreciate the Salisbury Playhouse&mdash;a renowned regional theatre that adds to the city&rsquo;s vibrant arts scene.\r\n\r\nOriginally built as the Dower House to the Longford Estate and overlooking the majestic Longford Castle, Alward House remains within the family of the Earl of Radnor, preserving its heritage and grandeur.\r\n\r\nInside, the property offers generous space for relaxation and entertaining. Five elegant reception rooms, including stylish drawing rooms and a spacious dining room, provide the perfect setting to unwind and gather with friends or family. The fully equipped kitchen has everything needed to cater for a group, or you may choose to bring in a private chef for a more luxurious experience. The dining room features a large table that comfortably seats all guests, and high chairs are available for little ones.\r\n\r\nWith 12 bedrooms, Alward House can accommodate large groups with ease. The sleeping arrangements include a flexible mix of Super King Link beds, Doubles, Singles, and portable folding Z-beds&mdash;ideal for children. Fresh linens and bedding are provided to ensure a restful night&rsquo;s sleep for all.\r\n\r\nThe property also includes six well-appointed bathrooms, two additional WCs, and all the modern amenities you&rsquo;d expect, all while maintaining its classic charm.\r\n\r\nAlward House is the perfect setting for memorable reunions, celebrations, or simply a peaceful retreat in one of England&rsquo;s most beautiful countryside locations.\r\n","changeover":"","second":"","address_line":"Alward House, Shute End Road, Alderbury","city":"Salisbury ","country":"GB","post_code":"SP5 3DJ","latitude":"51.0459912","longitude":"-1.7471405","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":12,"bathroom_count":9,"area":10000,"reviews":[],"content_listings":[{"property_id":636608,"property_url":"https:\/\/groupretreats.co.uk\/pf\/alward-house\/","customer_property_id":"AWH","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":true,"maximum_adults":35,"maximum_guests":35,"maximum_children":20,"maximum_infants":20,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enquiries":true}],"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","COMMON_SURFACE_DISINFECTANT_CLE