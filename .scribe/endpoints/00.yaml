 Swim Spa and Gardens","description":"Welcome to Glentworth Hall, a truly striking Grade II listed Lincolnshire country house. Situated in a sought after location within 5 acres of glorious grounds., This period residence oozes elegance. Perfect to spend quality time with family or friends and escape from the modern world whether that be as a celebration, holiday or a relaxing break. Here you will find something for everyone.","accommodations_summary":"On entering the property, you are greeted by a stunning gallery staircase. Inside you will find a well appointed kitchen with everything you need to prepare meals for everyone in the group, whether you choose to do it yourself or bring in a profession chef!<br \/>\r\n<br \/>\r\nThe games room is equipped with a pool table, air hockey and various board games, perfect for family and friends to all get together and have some fun.<br \/>\r\n<br \/>\r\nGlentworth Hall has 10 comfortable bedrooms sleeping up to 33 people. Bedrooms 1-7 all have ensuites with a further bathroom shared by rooms 8-10. Downstairs you will find a his and hers cloakroom.<br \/>\r\n<br \/>\r\nSurrounded by delightful countryside views, you will also have access to private formal gardens and paddock land, great to explore or enjoy a picnic. The outside swim\/spa is perfect to unwind and take in the tranquil surroundings.<br \/>\r\n<br \/>\r\nAround a 20 minute drive away you will find Lincoln, a vibrant university city which offers a variety of facilities including an excellent choice of shops, restaurants, public houses and leisure activities.","location_description":"In the Village of Glentworth, less than a 30 minut...","changeover":"","second":"","address_line":"Glentworth Hall, Northlands Road ","city":"Glentworth ","country":"GB","post_code":"DN21 5DA","latitude":"53.3819800","longitude":"-0.5737900","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":10,"bathroom_count":8,"area":15000,"area_unit":"MetersSquared",