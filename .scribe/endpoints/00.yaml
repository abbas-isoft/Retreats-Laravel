1,"property_name":"Saham Grove Hall by Group Retreats","subcaption":"Sleeps 28 - Grand period farmhouse with tennis court and spa","description":"Saham Grove Hall is a grand 11 bedroom Victorian property, which sleeps 28 people. It is packed with original features, open fires, pool table, hot tub, above ground pool, tennis court, games room and a dining table that comfortably seats 20 people. It is nestled in the sleepy countryside of Norfolk and is perfect for family breaks, couples, milestone celebrations, business groups and hen parties.","accommodations_summary":"The house is arrive at via an impressive private drive which brings you the imposing forecourt of the house. Before you and your guests step through the door, you will know that you&#39;re in for a great time at Saham Grove Hall. It is packed with original features, open fires, pool table, a games room and a dining table that sits 20 people.<br \/>\r\n<br \/>\r\nSurrounded by four acres of beautifully kept gardens and grounds, there is more than enough space to entertain the whole group with garden games and even a spot of tennis. We also have a hot tub to help soak away the stresses of everyday life which is available all year round. If that&#39;s not enough, then why not create lasting memories with your friends and family beside our above ground pool? Accompanied with sun loungers and additional seating, the pool area provides the perfect spot for gatherings in the warmer months of April - October.. There is a games room complete will pool table, and two lounges where you can entertain friends, or perhaps get away from it all with a book.<br \/>\r\n<br \/>\r\nThe house backs onto a farmyard, which is a working arable farm. You may experience the sounds of a busy farm at peak times such as Spring and harvest, but this only adds to the countryside experience.","location_description":"Saham Grove Hall is perfectly nestled within the Norfolk countryside, allowing for relaxation and unwinding with your friends and family. The house is approximately 30 minutes from Norwich and under an hour to Blakeney Point on the North Norfolk Coast - the perfect spot for seal watching! For the more adventurous, Thetford Forest is approximately 20 minutes away, offering countless long walks, mountain biking and even some high-rope courses.","changeover":"","second":"","address_line":"Saham Grove Hall, Shipdham","city":"Dereham","country":"GB","post_code":"IP25 7RE","latitude":"52.6227513","longitude":"0.8486249","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":11,"bathroom_count":5,"area":10000,"reviews":[],"content_listings":[{"property_id":634897,"property_url":"https:\/\/groupretreats.co.uk\/pf\/saham-grove-hall\/","customer_property_id":"SGH","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":true,"maximum_adults":28,"maximum_guests":28,"maximum_children":20,"maximum_infants":20,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enquiries":true}],"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","AMENITIES_WASHER","KITCHEN_DINING_COFFEEMAKER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_MICROWAVE","KITCHEN_DINING_OVEN","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","OUTDOOR_BALCONY","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","AMENITIES_LINENS","AMENITIES_HAIR_DRYER","GENERAL_TRAVEL_CRIB","ENTERTAINMENT_SMART_TV"],"images":[{"property_content_id":16,"photo_id":"191808218","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191808218