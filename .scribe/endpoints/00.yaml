intimate, and one of England&rsquo;s most exceptional properties.","accommodations_summary":"<p>A warm welcome to The Castle, a truly exceptional Grade II* castle which is steeped in history since the early 1700&#39;s. Nestled away in the Durham countryside, sitting in 14 acres of land surrounded by a nature reserve. This is the ideal place to escape from the modern world and indulge with friends and family. Whether that be sitting by one of the many fireplaces with a good page turner or retreating to the dungeon for a drink in it&#39;s own self service bar.<br \/>\r\n<br \/>\r\nThe dungeon is fashioned with wrought iron gates, which hosts multiple rooms spanning the entire footprint of the Castle.<br \/>\r\n<br \/>\r\nThe truly exceptional main entrance hall greets you with an elegant sweeping staircase. A real showstopper for entertaining, creating a feel for the rest of the property. The formal dining room equally offers a wonderful setting for self catered dining and seats up to 32 guests.<br \/>\r\n<br \/>\r\nThe ground floor houses the living quarters which comprises of the Entrance Hall, Dining room, Living room, Lounge, and Kitchen.<br \/>\r\n<br \/>\r\nThe sleeping quarters include 11 beautifully decorated bedrooms over two floors and 12 bathrooms. Plenty of room for large groups. <span style=\"font-size:12px\"><span style=\"font-family:arial,helvetica,sans-serif\">All bedding, linen and towels are provided.<br \/>\r\n<br \/>\r\nThe garden can be accessed through open doors onto a sun trapped patio, which has plenty of seating and a bbq suitable for large outdoor self-catering along with a hot tub and sauna. The property also benefits from a substantial glass palm room to the front.<br \/>\r\n<br \/>\r\nPlease note that The Castle is closed from August 2025 until June 2026 due to some ongoing repairs.<\/span><\/span><\/p>\r\n","location_description":"Nestled away in the Durham countryside and sitting...","changeover":"","second":"","address_line":"The Castle, The Village Castle Eden","city":"Hartlepool","country":"GB","post_code":"TS27 4SL","latitude":"54.7377300","longitude":"-1.3357000","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":11,"bathroom_count":12,"area":15102,"area_unit":"SquareFeet","amenities":["AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","AMENITIES_WASHER","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","OUTDOOR_BALCONY","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","AMENITIES_FIREPLACE","AMENITIES_HAIR_DRYER","AMENITIES_LINENS","GENERAL_TRAVEL_CRIB","ENTERTAINMENT_SMART_TV"],"created_at":"2025-07-17T16:25:15.000000Z","updated_at":"2025-09-23T15:18:20.000000Z","images":[{"id":10755,"property_content_id":7,"photo_id":"191028872","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191028872.jpg","created_at":"2025-09-23T15:18:20.000000Z","updated_at":"2025-09-23T15:18:20.000000Z"},{"id":10756,"property_content_id":7,"photo_id":"191028749","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191028749.jpg","created_at":"2025-09-23T15:18:20.000000Z","updated_at":"2025-09-23T15:18:20.000000Z"},{"id":10757,"property_content_id":7,"photo_id":"191028888","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191028888.jpg","created_at":"2025-09-23T15:18:20.000000Z","updated_at":"2025-09-23T15:18:20.000000Z"},{"id":10758,"property_content_id":7,"photo_id":"191028887","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191028887.jpg","created_at":"2025-09-23T15:18:20.000000Z","updated_at":"2025-09-23T15:18:20.000000Z"},{"id":10759,"property_content_id":7,"photo_id":"191028879","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/custom\/large\/191028879.jpg","created_at":"2025-09-23T15:18:20.000000Z","updated_at":"2025-0