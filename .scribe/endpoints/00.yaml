xing by the fire or celebrate in style and enjoy some drinks by the pool, your time at Fawley Court will become treasured memories!<br \/>\r\n<br \/>\r\nInside the house, you will find our &#39;Great Hall&#39;, with a huge fire place and seating for up to 36, you can really dine in style! The kitchen is fully stocked with everything you will need to prepare and enjoy a fantastic meal, whether you decide to cook it yourself or bring in a professional chef.<br \/>\r\n<br \/>\r\nLeading off from the Great Hall there are a further three reception rooms. The Drawing Room is perfect for entertaining, the snug has comfy seating and a TV and the lounge has a card table and chess board.<br \/>\r\n<br \/>\r\nAt the other end of the house our fantastic indoor pool can be found. Our hot tub can seat up to eight! Leading off from the pool we have a games room with a large TV, pool table, dart boards, table football and plenty of seating. The conservatory and walled garden have seating for the whole group and BBQ.<br \/>\r\n<br \/>\r\nFawley Court has a total of 13 fantastic bedrooms, 4 of which are ensuite, a further 6 bathrooms and a downstairs loo. All bedding, linen and towels are provided.<br \/>\r\n<br \/>\r\nOutside we have wonderful gardens to explore with interconnected lakes which attract all kinds of wildlife.<br \/>\r\n<br \/>\r\nBeing in the heart of the Wye Valley, there is amazing countryside to be explored and amazing views to be seen!<\/span><\/span>","location_description":"Set amongst beautiful gardens in the heart of the...","changeover":"","second":"","address_line":"Fawley Cross","city":"Hereford","country":"GB","post_code":"HR1 4SP","latitude":"51.9643628","longitude":"-2.5997178","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":13,"bathroom_count":9,"area":10000,"area_unit":"MetersSquared","amenities":["SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_IRON_BOARD","AMENITIES_WASHER","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING