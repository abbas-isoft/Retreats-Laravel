hioned with wrought iron gates, which hosts multiple rooms spanning the entire footprint of the Castle.<br \/>\r\n<br \/>\r\nThe truly exceptional main entrance hall greets you with an elegant sweeping staircase. A real showstopper for entertaining, creating a feel for the rest of the property. The formal dining room equally offers a wonderful setting for self catered dining and seats up to 32 guests.<br \/>\r\n<br \/>\r\nThe ground floor houses the living quarters which comprises of the Entrance Hall, Dining room, Living room, Lounge, and Kitchen.<br \/>\r\n<br \/>\r\nThe sleeping quarters include 11 beautifully decorated bedrooms over two floors and 12 bathrooms. Plenty of room for large groups. All bedding, linen and towels are provided.<br \/>\r\n<br \/>\r\nThe garden can be accessed through open doors onto a sun trapped patio, which has plenty of seating and a bbq suitable for large outdoor self-catering along with a hot tub and sauna. The property also benefits from a substantial glass palm room to the front.<br \/>\r\n<br \/>\r\nPlease note that The Castle is closed from August 2025 until June 2026 due to some ongoing repairs.","location_description":"Nestled away in the Durham countryside and sitting...","changeover":"","second":"","address_line":"23 Lower Brook Street, Amended","city":"Ipswich ","country":"GB","post_code":"IP4 1AQ ","latitude":"52.0538630","longitude":"1.1549192","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":6,"bathroom_count":6,"area":0,"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","COMMON_SURFACE_DISINFECTANT_CLEANED","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_MICROWAVE","KITCHEN_DINING_OVEN","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GR