lant House - a stunning property made from straw bales and larch cladding, ensuring the perfect blend of of sustainability and luxury. This unique property comfortably sleeps up to 15 guests with the use of superking link beds, mezzanine beds, and even an impressive Caeser bed in the master bedroom! The large windows and indoor plants provides a refreshing and tranquil feel throughout the house, whilst the stunning decor supplies character and style, not that you need more of it when it comes to this property.<br \/>\r\n<br \/>\r\nThe kitchen comprises of Miele appliances ensuring you have everything you could possible wish for, alternatively you can hire a caterer to prepare meals for you whilst you dine at the large dining table. All pots, pans, cutlery and crockery are supplied. With an xbox, board games, and Netflix just to name a few, you can be sure that the children will be kept well entertained. They can even have a game of pool or darts in the games room!<br \/>\r\n<br \/>\r\nIndulge in relaxation in the infra-red sauna and unwind in the hot tub, both designed to enhance your experience. Outside you will find the remarkable natural swimming pond, which is available all year round! For those who love to entertain, the fully equipped outdoor kitchen offers everything you need to prepare delicious meals whilst simultaneously enjoying the serene views. The floating firepit deck enables you to enjoy the evenings in a comfortable and warm area.<\/p>\r\n","location_description":"In the picturesque village of Croperdy, The Plant House is surrounded by the serene views of the Oxfordshire countryside. The village provides great walking route opportunities, and is also well known for the Croperdy Festival which celebrates folk music.","changeover":"","second":"","address_line":"School Lane","city":"Cropredy","country":"GB","post_code":"OX17 1PX","latitude":"52.1094163","longitude":"-1.3180495","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_