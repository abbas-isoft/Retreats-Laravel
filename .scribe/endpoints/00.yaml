y enjoy the tranquillity that the property offers.","accommodations_summary":"Within the fully stocked kitchen, you will find everything you could possibly need to prepare meals for everyone in your group. Alternatively, you could hire in a private chef to cook for you whilst you sit back and relax! The dining room can seat up to 24 guests, and we can provide additional tables should you need more seating.<br \/>\r\n<br \/>\r\nThe lounge has comfortable seating with a TV, great for getting everyone together and watching a film. The snug is perfect for those guests who would like to enjoy some peace and quiet to really relax. The property boasts four indoor fire places, which are great spots to enjoy a drink and within the company of friends or family. In the games room you will find a pool table to enjoy, board games and we also provide a Bluetooth speaker so that you and your group can enjoy a sing-a-long.<br \/>\r\n<br \/>\r\nThe house has a total of nine beautifully decorated bedrooms and can accommodate up to 28 guests, meaning that there is enough space for the entire group. Two of the bedrooms are en-suite, and there are also two separate bathrooms.<br \/>\r\n<br \/>\r\nIn the beautiful gardens surrounding Ashfield Place Farm, you will find and a tennis court, swimming pool and hot tub for those who wish to exercise, or unwind and relax. The hot tub is heated all year round. Swimming pool available from 01 Apr to 1 Oct.<br \/>\r\n<br \/>\r\nIf you have the time to explore the large gardens, you will find many picturesque spots to enjoy a picnic! The large gardens are very well cared for, and there is plenty of space for exploring, games, and finding the perfect spot for a picnic! ","location_description":"Nine-bedroom Ashfield Place sits within 6 acres of land. This property is located in the beautiful Suffolk countryside. This stunning property is available to hire exclusively for family get togethers, celebrations, corporate entertaining, or team building exercises. Ashfield Place Farm provides an immediate sense of privacy from the moment you turn into the gate.","changeover":"","second":"","address_line":"Ashfield Place Farm","city":"Stowmarket","country":"GB","post_code":"IP14 6LU","latitude":"52.2088831","longitude":"1.2259665","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":9,"bathroom_count":4,"area":10000,"reviews":[],"content_listings":[{"property_id":624076,"property_url":"https:\/\/groupretreats.co.uk\/pf\/ashfield-place-farm\/","customer_property_id":"AP","accepted_payment_forms":"{\"cardPaymentForms\":[{\"cardCode\":\"Mastercard\",\"cardType\":\"Credit\"},{\"cardCode\":\"VisaDebitDelta\",\"cardType\":\"Credit\"}]}","cancellation_policy":"NoRefund","check_in_time":"16:00:00","check_out_time":"11:00:00","children_allowed":true,"maximum_adults":28,"maximum_guests":28,"maximum_children":20,"maximum_infants":20,"merchant_name":"Group Retreats","pets_allowed":true,"smoking_allowed":false,"allow_bookings":true,"allow_enquiries":true}],"area_unit":"MetersSquared","amenities":["AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_OVEN","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","OUTDOOR_BALCONY","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","AMENITIES_FIREPLACE","AMENITIES_HAIR_DRYER","AMENITIES_LINENS","GENERAL_TRAVEL_CRIB","ENTERTAINMENT_SMART_TV"],"images":[{"property_content_id":13,"photo_id":"192118191","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192118191.jpg"},{"property_content_id":13,"photo_id":"192118204","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192118204.jpg"},{"property_content_id":13,"photo_id":"192118202","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/192118202.jpg"},{"property_content_id":13,"photo_id":"192118198","url":"https:\/\/c621446.ssl.cf3.rackcdn