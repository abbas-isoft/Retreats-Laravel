 sofa beds, there are many different combinations of layout to suit you group. All bedding, linen and towels are provided.<br \/>\r\n<br \/>\r\nThere is a cosy lounge and separate drawing room, both with open fires, a perfect spot to enjoy a drink with family and friends. Within the fully stocked kitchen, you will find everything you could possibly need to prepare meals for everyone in your group. Alternatively, you could hire in a private chef to cook for you whilst you sit back and relax! The dining room can seat up to 18 guests, and we can provide an additional chairs should you need 2 more guests to be seated.<br \/>\r\n<br \/>\r\nOutside you are surrounded by stunning peaceful grounds in a private garden. You will find a secluded hot tub and sauna. Both are available all year around.Outside you will also find our above ground swimming pool, which is available from April - October. The decking area and sun loungers provides the perfect place to relax and create lasting memories. A barbecue is available for outside dining and entertaining, great for taking in the fantastic surroundings whilst enjoying fantastic food and company.<br \/>\r\n<br \/>\r\nHarkstead Hall is close to Alton Water which offers walking trails, cycling and water sports; there is plenty to do in the local area, whether you are looking for an active break, or to relax in comfort.","location_description":"Nearby you will find local pubs, restaurants and c...","changeover":"","second":"","address_line":"Lower House Road","city":"Ipswich","country":"GB","post_code":"IP9 1DB","latitude":"51.9734985","longitude":"1.1959704","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":6,"bathroom_count":5,"area":1000,"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","SUITABILITY_ACCESSIBILITY_WHEELCHAIR_ACCESSIBLE","KITCHEN_DINING_COFFEEM