 heart of Hadleigh&#39;s beautiful countryside. Steeped in character and designed with comfort in mind, this impressive home offers the ideal setting for large family holidays, special occasions, and corporate getaways.<\/p>\r\n<\/article>\r\n\r\n<article data-scroll-anchor=\"true\" data-testid=\"conversation-turn-4\" data-turn=\"assistant\" data-turn-id=\"request-WEB:929e2983-61b5-4afb-8e55-06cafbb30e90-1\" dir=\"auto\" tabindex=\"-1\">\r\n<p data-end=\"687\" data-start=\"442\"><\/p>\r\n<\/article>\r\n","accommodations_summary":"<p data-end=\"687\" data-start=\"442\">With 12 spacious bedrooms, the house comfortably accommodates up to 34 guests. Flexible sleeping arrangements include superking link beds, doubles, singles, sofa beds, and folding Z beds, making it easy to tailor the space to your group&rsquo;s needs.<\/p>\r\n\r\n<p data-end=\"1108\" data-start=\"689\">At the heart of the home is a fully equipped kitchen, stocked with everything needed for group catering &mdash; from cookware to serving dishes &mdash; whether you&rsquo;re preparing meals yourselves or hiring in a private chef to take care of everything while you relax. Near to kitchen, the grand dining room features a large table that seats all 34 guests together, perfect for shared meals, celebrations, or business dinners.We can also supply two high chairs for any little ones.<\/p>\r\n\r\n<p data-end=\"1437\" data-start=\"1110\">Inside, there&rsquo;s no shortage of space to unwind. Multiple stylish lounges and drawing rooms offer peaceful spots for conversation or reading, while the dedicated games room brings the family together for games nights. <\/p>\r\n\r\n<p data-end=\"1728\" data-start=\"1439\">Outside, the expansive gardens provide plenty of room to roam, play, or enjoy a peaceful coffee in the morning sun. For warmer months, the above-ground pool is open from 1st April to 1st October, while the hot tub is available all year round &mdash; a luxurious touch for guests in every season.<\/p>\r\n\r\n<p data-end=\"1951\" data-start=\"1730\">Whether you&#39;re planning a multi-generational family holiday, a milestone celebration, or a corporate retreat, this exceptional home offers a unique blend of heritage, comfort, and convenience in a truly memorable setting.<\/p>\r\n\r\n<p data-end=\"2085\" data-is-last-node=\"\" data-is-only-node=\"\" data-start=\"1953\"><strong data-end=\"1969\" data-start=\"1953\">Coming soon:<\/strong> A charming on-site cottage will be available later next year, offering additional accommodation for up to 6 guests.<br \/>\r\n<br \/>\r\nPlease note that this property is under refurbishment, and so the photos are representative only.<\/p>\r\n","location_description":"Hadleigh, Suffolk is a charming market town nestle...","changeover":"","second":"","address_line":"Holbecks Lane","city":"Hadleigh","country":"GB","post_code":"IP7 5PF","latitude":"52.0376010","longitude":"0.9432100","property_type":"Cottage","registration_number":"","epcRating":"","bedroom_count":12,"bathroom_count":10,"area":1,"area_unit":"MetersSquared","amenities":["AMENITIES_FIREPLACE","AMENITIES_PARKING","AMENITIES_FREE_WIFI","SPORTS_SWIMMING","AMENITIES_HEATING","AMENITIES_IRON_BOARD","KITCHEN_DINING_HIGHCHAIR","COMMON_SURFACE_DISINFECTANT_CLEANED","KITCHEN_DINING_COFFEEMAKER","AMENITIES_WASHER","KITCHEN_DINING_DISHES_UTENSILS","KITCHEN_DINING_DISHWASHER","KITCHEN_DINING_MICROWAVE","KITCHEN_DINING_OVEN","KITCHEN_DINING_REFRIGERATOR","KITCHEN_DINING_STOVE","OUTDOOR_FENCED_YARD","POOL_SPA_HOT_TUB","OUTDOOR_GRILL","OUTDOOR_BALCONY","SMOKE_DETECTOR","CARBON_MONOXIDE_DETECTOR","FIRST_AID_KIT","FIRE_EXTINGUISHER","ENTERTAINMENT_VIDEO_GAMES","ENTERTAINMENT_SMART_TV","AMENITIES_LIVING_ROOM","AMENITIES_HAIR_DRYER","GENERAL_TRAVEL_CRIB","AMENITIES_LINENS"],"created_at":"2025-07-17T16:25:47.000000Z","updated_at":"2025-09-23T15:18:46.000000Z","images":[{"id":11319,"property_content_id":21,"photo_id":"192717726","url":"https:\/\/c621446.ssl.cf3.rackcdn.com\/images\/cottages\/4k\/